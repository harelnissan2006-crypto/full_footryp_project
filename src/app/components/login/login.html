<div class="login-page">
  <div class="login-panel">
    <div class="hero-bar">
      <div>
        <div class="hero-tag">Football Travel Hub</div>
        <h2>Welcome back to Footryp</h2>
        <p>Login and discover the best match trips, stadium adventures and travel buddies tailored for fans.</p>
      </div>
      <div class="hero-icon">✈️⚽</div>
    </div>

    <div class="login-card">
      <div class="login-header">
        <div class="login-badge">Login</div>
        <div class="login-subtitle">Take off with your favorite teams</div>
      </div>

      <form [formGroup]="loginForm" (ngSubmit)="onLogin()">
        <label class="form-label">Username</label>
        <input type="text" formControlName="username" class="form-input" placeholder="Enter username">

        <label class="form-label">Password</label>
        <input type="password" formControlName="password" class="form-input" placeholder="Enter password">

        <button type="submit" [disabled]="loginForm.invalid" class="btn-login">
          Login
        </button>
      </form>

      <div class="register-cta">
        <p>New to Footryp? <a routerLink="/register">Create an account</a></p>
      </div>
    </div>
  </div>
</div>
