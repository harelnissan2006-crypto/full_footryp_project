<div class="container mt-5">
  <div class="card p-4 mx-auto shadow" style="max-width: 400px;">
    <h2 class="text-center mb-4">Login to Footryp</h2>
    
    <form [formGroup]="loginForm" (ngSubmit)="onLogin()">
      <div class="mb-3">
        <label class="form-label">Username</label>
        <input type="text" formControlName="username" class="form-control">
      </div>

      <div class="mb-3">
        <label class="form-label">Password</label>
        <input type="password" formControlName="password" class="form-control">
      </div>

      <button type="submit" [disabled]="loginForm.invalid" class="btn btn-primary w-100">
        Login
      </button>
    </form>

    <div class="text-center mt-3">
      <p>Don't have an account? <a routerLink="/register" class="fw-bold">Register here</a></p>
    </div>
  </div>
</div>
