<div class="card" *ngIf="matchTrip">
    <h3>{{ matchTrip.match.home_team }} vs {{ matchTrip.match.away_team }}</h3>
    <div class="details">
        <p><strong>Date:</strong> {{ matchTrip.match.match_date }} at {{ matchTrip.match.match_time }}</p>
        <p><strong>Location:</strong> {{ matchTrip.match.home_city }} ({{ matchTrip.match.home_iata }})</p>
        <p><strong>Flight Date:</strong> {{ matchTrip.match.flight_date }}</p>
    </div>

    <div class="card-footer">
        <button class="btn-find-package" (click)="findPackage()">
            🧳 Find Package
        </button>
        <button class="btn-join-chat"
            [routerLink]="['/chat', matchTrip.match.home_team + '_' + matchTrip.match.away_team + '_' + matchTrip.match.match_date]">
            💬 Join Chat
        </button>
    </div>
</div>
