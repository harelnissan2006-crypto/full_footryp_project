<div class="card h-100 shadow-sm border-0">
  <div class="card-header bg-primary text-white text-center py-3">
    <h6 class="mb-0 text-uppercase small">חבילת כדורגל</h6>
  </div>

  <div class="card-body">
    <div class="d-flex justify-content-between align-items-center mb-4 text-center">
      <div class="flex-fill">
        <strong class="d-block">{{ matchTrip.homeTeam }}</strong>
      </div>
      <div class="px-2 text-muted small">נגד</div>
      <div class="flex-fill">
        <strong class="d-block">{{ matchTrip.awayTeam }}</strong>
      </div>
    </div>

    <div class="text-center mb-3">
      <div class="small text-muted">
        <i class="bi bi-geo-alt-fill"></i> {{ matchTrip.city }} ({{ matchTrip.iataCode }})
      </div>
      <div class="small text-muted">
        <i class="bi bi-calendar-event"></i> {{ matchTrip.matchDate | date:'dd/MM/yyyy' }}
      </div>
    </div>

    <div class="p-2 rounded-3 text-center small" 
         [ngClass]="matchTrip.flightInfo.direct ? 'bg-success-subtle text-success' : 'bg-warning-subtle text-warning'">
      <i class="bi bi-airplane"></i> {{ getFlightInfo() }}
    </div>
  </div>

  <div class="card-footer bg-white border-0 pb-3">
    <div class="d-flex justify-content-between align-items-end">
      <div>
        <span class="text-muted x-small d-block">מחיר משוער</span>
        <span class="h5 mb-0 text-dark">$---</span> 
      </div>
      
      <button class="btn btn-primary btn-sm rounded-pill px-3">
        פרטי החבילה
      </button>
    </div>
  </div>
</div>
